<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resumidor de textos con Mistral 7B.">
    <title>AI-Powered Text Summarizer</title>
    <!-- Hoja de estilos extraída del bloque <style> original. -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Encabezado principal de la aplicación. -->
    <h1>AI-Powered Text Summarizer</h1>

    <!-- Controles de entrada del usuario. -->
    <textarea id="text-input" placeholder="Introduce el texto que deseas resumir..."></textarea><br>
    <button id="summarize-button">Resumir</button>

    <h2>Resumen:</h2>
    <div id="summary">Tu resumen aparecerá aquí...</div>

    <!-- Lógica del navegador (se carga después de parsear el HTML). -->
    <script src="/static/script.js" defer></script>

</body>
</html>
